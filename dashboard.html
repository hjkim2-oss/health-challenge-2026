<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대시보드 — 2026년 상반기 건강프로그램</title>
  <style>
    :root {
      --primary:   #2563EB;
      --pri-dark:  #1D4ED8;
      --pri-light: #EFF6FF;
      --secondary: #7C3AED;
      --team-c:    #0891B2;
      --gold:      #F59E0B;
      --silver:    #94A3B8;
      --bronze:    #CD7C3A;
      --bg:        #F1F5F9;
      --card:      #FFFFFF;
      --text:      #0F172A;
      --text-sub:  #475569;
      --text-muted:#94A3B8;
      --border:    #E2E8F0;
      --radius:    14px;
      --radius-sm: 10px;
      --shadow:    0 4px 24px rgba(0,0,0,0.08);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── HEADER ───────────────────────────────── */
    .site-header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      color: #fff;
      position: sticky; top: 0; z-index: 200;
      box-shadow: 0 2px 12px rgba(37,99,235,0.3);
    }
    .header-inner {
      max-width: 1200px; margin: 0 auto;
      padding: 0 24px; height: 62px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      width: 34px; height: 34px;
      background: rgba(255,255,255,0.2); border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px;
    }
    .brand-name { font-size: 16px; font-weight: 700; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .btn-header {
      padding: 7px 16px; border-radius: 8px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      border: none; transition: all 0.15s;
      display: flex; align-items: center; gap: 5px;
    }
    .btn-submit {
      background: rgba(255,255,255,0.18); color: #fff;
      text-decoration: none;
    }
    .btn-submit:hover { background: rgba(255,255,255,0.28); }
    .btn-refresh {
      background: #fff; color: var(--primary);
    }
    .btn-refresh:hover { background: #f0f4ff; }
    .btn-refresh svg { transition: transform 0.4s; }
    .btn-refresh.spinning svg { transform: rotate(360deg); }

    /* ── MAIN ─────────────────────────────────── */
    .main { max-width: 1200px; margin: 0 auto; padding: 28px 24px 64px; }

    /* ── LOADING ──────────────────────────────── */
    #loading-screen {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 80px 0; gap: 16px;
    }
    .ld-spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .ld-text { font-size: 14px; color: var(--text-muted); }

    /* ── STATS ROW ────────────────────────────── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px; margin-bottom: 24px;
    }
    .stat-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px 24px;
      display: flex; flex-direction: column; gap: 4px;
      animation: fadeUp 0.3s ease both;
    }
    .stat-card:nth-child(1) { animation-delay: 0s; }
    .stat-card:nth-child(2) { animation-delay: 0.06s; }
    .stat-card:nth-child(3) { animation-delay: 0.12s; }
    .stat-icon { font-size: 22px; margin-bottom: 4px; }
    .stat-value { font-size: 28px; font-weight: 800; color: var(--primary); }
    .stat-label { font-size: 13px; color: var(--text-muted); font-weight: 500; }

    /* ── SECTION TITLE ────────────────────────── */
    .section-title {
      font-size: 16px; font-weight: 700;
      color: var(--text);
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 16px;
    }

    /* ── RANKINGS GRID ────────────────────────── */
    .rankings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px; margin-bottom: 24px;
    }
    .rank-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      animation: fadeUp 0.3s ease both;
    }
    .rank-card:nth-child(1) { animation-delay: 0.1s; }
    .rank-card:nth-child(2) { animation-delay: 0.18s; }

    /* Rank item */
    .rank-list { display: flex; flex-direction: column; gap: 10px; }
    .rank-item {
      display: flex; align-items: center; gap: 12px;
    }
    .rank-medal {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 800; flex-shrink: 0;
    }
    .medal-1 { background: #FEF3C7; color: #B45309; font-size: 18px; }
    .medal-2 { background: #F1F5F9; color: #64748B; font-size: 18px; }
    .medal-3 { background: #FEF0E6; color: #B45309; font-size: 18px; }
    .medal-n { background: var(--bg); color: var(--text-muted); font-size: 13px; }

    .rank-info { flex: 1; min-width: 0; }
    .rank-name {
      font-size: 14px; font-weight: 600; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .rank-sub  { font-size: 12px; color: var(--text-muted); }
    .rank-count {
      font-size: 16px; font-weight: 800; color: var(--primary);
      white-space: nowrap; flex-shrink: 0;
    }
    .rank-bar-wrap {
      height: 5px; background: var(--bg);
      border-radius: 99px; overflow: hidden; margin-top: 5px;
    }
    .rank-bar {
      height: 100%; border-radius: 99px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      transition: width 0.6s ease;
    }

    /* Top-1 highlight */
    .rank-item.top1 .rank-name  { color: var(--primary); font-size: 15px; }
    .rank-item.top1 .rank-count { font-size: 18px; }
    .rank-item.top1 .rank-bar   { background: linear-gradient(90deg, #F59E0B, #EF4444); }

    .empty-rank {
      padding: 32px 0; text-align: center;
      font-size: 13px; color: var(--text-muted);
    }
    .empty-rank span { font-size: 28px; display: block; margin-bottom: 8px; }

    /* ── GALLERY CARD ─────────────────────────── */
    .gallery-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      animation: fadeUp 0.3s ease 0.22s both;
    }

    /* Filter tabs */
    .filter-tabs {
      display: flex; gap: 8px;
      margin-bottom: 20px; flex-wrap: wrap;
    }
    .filter-btn {
      padding: 6px 16px; border-radius: 20px;
      font-size: 13px; font-weight: 600;
      border: 1.5px solid var(--border);
      background: var(--bg); color: var(--text-sub);
      cursor: pointer; transition: all 0.15s;
    }
    .filter-btn:hover { border-color: var(--primary); color: var(--primary); }
    .filter-btn.active {
      background: var(--primary); border-color: var(--primary);
      color: #fff;
    }

    /* Photo grid */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 14px;
    }
    .photo-card {
      border-radius: var(--radius-sm);
      overflow: hidden; cursor: pointer;
      background: var(--bg);
      transition: transform 0.18s, box-shadow 0.18s;
      border: 1px solid var(--border);
    }
    .photo-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
    .photo-img-wrap {
      position: relative; aspect-ratio: 1;
      overflow: hidden; background: #e2e8f0;
    }
    .photo-img-wrap img {
      width: 100%; height: 100%; object-fit: cover;
      display: block; transition: transform 0.25s;
    }
    .photo-card:hover .photo-img-wrap img { transform: scale(1.05); }
    .photo-overlay {
      position: absolute; inset: 0;
      background: rgba(37,99,235,0.55);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.2s; color: #fff;
      font-size: 22px;
    }
    .photo-card:hover .photo-overlay { opacity: 1; }
    .photo-img-wrap .img-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; color: var(--text-muted);
    }

    .photo-meta {
      padding: 10px 12px;
      display: flex; flex-direction: column; gap: 3px;
    }
    .photo-meta-top { display: flex; align-items: center; gap: 6px; }
    .cert-tag {
      font-size: 10px; font-weight: 700;
      padding: 2px 7px; border-radius: 20px;
    }
    .tag-diet     { background: #DCFCE7; color: #15803D; }
    .tag-exercise { background: #DBEAFE; color: #1D4ED8; }
    .tag-team     { background: #CFFAFE; color: #0E7490; }
    .photo-name   { font-size: 13px; font-weight: 600; color: var(--text); }
    .photo-team   { font-size: 11px; color: var(--text-muted); }
    .photo-date   { font-size: 11px; color: var(--text-muted); }

    .empty-gallery {
      grid-column: 1/-1; padding: 48px 0; text-align: center;
    }
    .empty-gallery span { font-size: 36px; display: block; margin-bottom: 10px; }
    .empty-gallery p { font-size: 14px; color: var(--text-muted); }

    /* ── LIGHTBOX ─────────────────────────────── */
    #lightbox {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.88); z-index: 1000;
      align-items: center; justify-content: center;
      padding: 20px;
    }
    #lightbox.open { display: flex; }

    .lb-wrap {
      max-width: 900px; width: 100%;
      background: var(--card); border-radius: var(--radius);
      overflow: hidden; display: flex;
      max-height: 90vh;
    }
    .lb-img-side {
      flex: 1; min-width: 0;
      background: #0f172a;
      display: flex; align-items: center; justify-content: center;
    }
    .lb-img-side img {
      max-width: 100%; max-height: 80vh;
      object-fit: contain; display: block;
    }
    .lb-info-side {
      width: 220px; flex-shrink: 0;
      padding: 24px 20px;
      display: flex; flex-direction: column; gap: 16px;
    }
    .lb-close {
      position: absolute; top: 20px; right: 20px;
      width: 38px; height: 38px; border-radius: 50%;
      background: rgba(255,255,255,0.12); color: #fff;
      border: none; font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .lb-close:hover { background: rgba(255,255,255,0.22); }
    .lb-nav {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,0.12); color: #fff;
      border: none; font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .lb-nav:hover { background: rgba(255,255,255,0.25); }
    #lb-prev { left: 16px; }
    #lb-next { right: 16px; }
    .lb-info-label { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .lb-info-val   { font-size: 15px; font-weight: 600; color: var(--text); margin-top: 2px; }
    .lb-info-row   { border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    .lb-info-row:last-child { border-bottom: none; }

    /* ── UPDATED TAG ──────────────────────────── */
    .update-info {
      font-size: 12px; color: rgba(255,255,255,0.6);
      display: flex; align-items: center; gap: 5px;
    }

    /* ── ANIMATIONS ───────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── RESPONSIVE ───────────────────────────── */
    @media (max-width: 768px) {
      .main { padding: 20px 16px 52px; }
      .stats-row { grid-template-columns: repeat(3,1fr); gap: 10px; }
      .stat-card { padding: 16px; }
      .stat-value { font-size: 22px; }
      .rankings-grid { grid-template-columns: 1fr; }
      .lb-wrap { flex-direction: column; }
      .lb-info-side { width: 100%; flex-direction: row; flex-wrap: wrap; gap: 8px; padding: 16px; }
      .lb-info-row { border-bottom: none; padding-bottom: 0; border-right: 1px solid var(--border); padding-right: 12px; }
      .lb-info-row:last-child { border-right: none; }
      .brand-name { font-size: 13px; }
      .photo-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    }
    @media (max-width: 480px) {
      .stats-row { grid-template-columns: 1fr 1fr; }
      .stats-row .stat-card:last-child { grid-column: 1/-1; }
      .header-actions .btn-submit { display: none; }
    }
  </style>
</head>
<body>

<!-- ── HEADER ──────────────────────────────────── -->
<header class="site-header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-icon">🏃</div>
      <span class="brand-name">2026년 상반기 건강프로그램</span>
    </div>
    <div class="header-actions">
      <div class="update-info" id="update-time"></div>
      <a href="index.html" class="btn-header btn-submit">✏️ 인증 제출</a>
      <button class="btn-header btn-refresh" id="btn-refresh">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
        새로고침
      </button>
    </div>
  </div>
</header>

<main class="main">

  <!-- Loading -->
  <div id="loading-screen">
    <div class="ld-spinner"></div>
    <p class="ld-text">데이터를 불러오는 중...</p>
  </div>

  <!-- Dashboard content (hidden while loading) -->
  <div id="dashboard" style="display:none">

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-icon">📋</div>
        <div class="stat-value" id="st-total">0</div>
        <div class="stat-label">총 제출 건수</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🏅</div>
        <div class="stat-value" id="st-teams">0</div>
        <div class="stat-label">참여 팀 수</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">👥</div>
        <div class="stat-value" id="st-persons">0</div>
        <div class="stat-label">참여 인원</div>
      </div>
    </div>

    <!-- Rankings -->
    <div class="rankings-grid">

      <!-- Team ranking -->
      <div class="rank-card">
        <div class="section-title">🏆 팀별 순위</div>
        <div class="rank-list" id="team-ranking"></div>
      </div>

      <!-- Personal ranking -->
      <div class="rank-card">
        <div class="section-title">👤 개인 순위</div>
        <div class="rank-list" id="personal-ranking"></div>
      </div>

    </div>

    <!-- Photo gallery -->
    <div class="gallery-card">
      <div class="section-title">📸 인증샷 갤러리</div>

      <div class="filter-tabs">
        <button class="filter-btn active" data-f="all">전체</button>
        <button class="filter-btn" data-f="개인 인증">개인 인증</button>
        <button class="filter-btn" data-f="팀 인증">팀 인증</button>
      </div>

      <div class="photo-grid" id="photo-grid"></div>
    </div>

  </div><!-- /#dashboard -->

</main>

<!-- ── LIGHTBOX ──────────────────────────────────── -->
<div id="lightbox">
  <button class="lb-close" id="lb-close">✕</button>
  <button class="lb-nav" id="lb-prev">‹</button>
  <button class="lb-nav" id="lb-next">›</button>
  <div class="lb-wrap">
    <div class="lb-img-side">
      <img id="lb-img" src="" alt="인증샷">
    </div>
    <div class="lb-info-side">
      <div class="lb-info-row">
        <div class="lb-info-label">이름</div>
        <div class="lb-info-val" id="lb-name">—</div>
      </div>
      <div class="lb-info-row">
        <div class="lb-info-label">소속팀</div>
        <div class="lb-info-val" id="lb-team">—</div>
      </div>
      <div class="lb-info-row">
        <div class="lb-info-label">인증유형</div>
        <div class="lb-info-val" id="lb-type">—</div>
      </div>
      <div class="lb-info-row">
        <div class="lb-info-label">인증항목</div>
        <div class="lb-info-val" id="lb-item">—</div>
      </div>
      <div class="lb-info-row">
        <div class="lb-info-label">제출일시</div>
        <div class="lb-info-val" id="lb-date">—</div>
      </div>
    </div>
  </div>
</div>

<script>
// =====================================================
// ▼ 인증 폼(index.html)과 동일한 GAS URL을 입력하세요 ▼
// =====================================================
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwf-Cma1p940yoRbDcBZuv_65h73wqDtneyN5LJbyTYIA2suC8JTWSFD-qKSI1atu8p0Q/exec';
// =====================================================

let allSubmissions = [];
let filteredSubs   = [];
let lbIndex        = 0;

/* ── 드라이브 썸네일 URL 변환 ─────────────────────── */
function driveId(url) {
  const m = String(url).match(/\/d\/([^\/\?]+)/);
  return m ? m[1] : null;
}
function thumbUrl(url, size = 'w400') {
  const id = driveId(url);
  return id ? `https://drive.google.com/thumbnail?id=${id}&sz=${size}` : '';
}

/* ── 데이터 로드 ───────────────────────────────────── */
async function loadData() {
  const btn = document.getElementById('btn-refresh');
  btn.classList.add('spinning');
  btn.disabled = true;

  try {
    const res  = await fetch(`${GAS_URL}?action=getData`);
    const json = await res.json();

    allSubmissions = json.submissions || [];

    renderStats(json);
    renderTeamRanking(json.teamRanking || []);
    renderPersonalRanking(json.personalRanking || []);
    renderGallery('all');

    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';

    const now = new Date().toLocaleString('ko-KR', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
    document.getElementById('update-time').textContent = `업데이트 ${now}`;

  } catch (err) {
    console.error('데이터 로드 오류:', err);
    document.getElementById('loading-screen').innerHTML =
      `<div style="text-align:center; padding:60px 20px;">
        <div style="font-size:36px;margin-bottom:12px;">⚠️</div>
        <p style="color:#64748B;font-size:14px;">데이터를 불러오지 못했습니다.<br>GAS URL을 확인하거나 잠시 후 다시 시도해 주세요.</p>
        <button onclick="location.reload()" style="margin-top:16px;padding:8px 20px;border-radius:8px;background:#2563EB;color:#fff;border:none;font-size:14px;cursor:pointer;">다시 시도</button>
      </div>`;
  } finally {
    btn.classList.remove('spinning');
    btn.disabled = false;
  }
}

/* ── 통계 ──────────────────────────────────────────── */
function renderStats(json) {
  document.getElementById('st-total').textContent   = (json.total   || 0) + '건';
  document.getElementById('st-teams').textContent   = (json.teamRanking?.length   || 0) + '팀';
  document.getElementById('st-persons').textContent = (json.personalRanking?.length || 0) + '명';
}

/* ── 순위 공통 렌더 ────────────────────────────────── */
function renderRanking(containerId, items, nameFn, subFn) {
  const el = document.getElementById(containerId);
  if (!items.length) {
    el.innerHTML = `<div class="empty-rank"><span>📭</span>아직 데이터가 없습니다.</div>`;
    return;
  }
  const max = items[0].count;
  el.innerHTML = items.map((item, i) => {
    const rank = i + 1;
    const medals  = ['🥇','🥈','🥉'];
    const mClass  = ['medal-1','medal-2','medal-3','medal-n'][Math.min(i,3)];
    const iClass  = rank === 1 ? 'rank-item top1' : 'rank-item';
    const pct     = Math.round((item.count / max) * 100);
    return `
      <div class="${iClass}">
        <div class="rank-medal ${mClass}">${rank <= 3 ? medals[i] : rank}</div>
        <div class="rank-info">
          <div class="rank-name">${nameFn(item)}</div>
          ${subFn(item) ? `<div class="rank-sub">${subFn(item)}</div>` : ''}
          <div class="rank-bar-wrap"><div class="rank-bar" style="width:${pct}%"></div></div>
        </div>
        <div class="rank-count">${item.count}건</div>
      </div>`;
  }).join('');
}

function renderTeamRanking(data) {
  renderRanking('team-ranking',    data, d => d.team, () => '');
}
function renderPersonalRanking(data) {
  renderRanking('personal-ranking', data, d => d.name, d => d.team);
}

/* ── 갤러리 렌더 ───────────────────────────────────── */
function renderGallery(filter) {
  filteredSubs = filter === 'all'
    ? allSubmissions
    : allSubmissions.filter(s => s.certType === filter);

  const grid = document.getElementById('photo-grid');

  if (!filteredSubs.length) {
    grid.innerHTML = `<div class="empty-gallery"><span>📭</span><p>해당 조건의 인증샷이 없습니다.</p></div>`;
    return;
  }

  grid.innerHTML = filteredSubs.map((s, i) => {
    const thumb = thumbUrl(s.photoUrl);
    const isTeam = s.certType === '팀 인증';
    const tagCls  = isTeam ? 'tag-team' : (s.certItem?.includes('식단') ? 'tag-diet' : 'tag-exercise');
    const tagTxt  = isTeam ? '팀인증' : (s.certItem?.includes('식단') ? '식단' : '운동');
    const dateStr = String(s.date).slice(5, 16); // MM-DD HH:mm
    const teamDisplay = isTeam ? s.teamName : s.myTeam;
    return `
      <div class="photo-card" onclick="openLightbox(${i})">
        <div class="photo-img-wrap">
          ${thumb
            ? `<img src="${thumb}" alt="${s.name} 인증샷" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'img-placeholder\\'>🖼️</div>'">`
            : `<div class="img-placeholder">🖼️</div>`}
          <div class="photo-overlay">🔍</div>
        </div>
        <div class="photo-meta">
          <div class="photo-meta-top">
            <span class="cert-tag ${tagCls}">${tagTxt}</span>
            <span class="photo-name">${s.name}</span>
          </div>
          <div class="photo-team">${teamDisplay}</div>
          <div class="photo-date">${dateStr}</div>
        </div>
      </div>`;
  }).join('');
}

/* ── 필터 탭 ─────────────────────────────────────── */
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderGallery(btn.dataset.f);
  });
});

/* ── 라이트박스 ─────────────────────────────────── */
function openLightbox(i) {
  lbIndex = i;
  showLb(i);
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function showLb(i) {
  const s    = filteredSubs[i];
  const full = thumbUrl(s.photoUrl, 'w1200');
  document.getElementById('lb-img').src  = full || '';
  document.getElementById('lb-name').textContent = s.name;
  document.getElementById('lb-team').textContent = s.certType === '팀 인증' ? s.teamName : s.myTeam;
  document.getElementById('lb-type').textContent = s.certType;
  document.getElementById('lb-item').textContent = s.certType === '팀 인증' ? '팀 모임 인증' : (s.certItem || '—');
  document.getElementById('lb-date').textContent = String(s.date).slice(0, 16);
  document.getElementById('lb-prev').style.display = i > 0 ? 'flex' : 'none';
  document.getElementById('lb-next').style.display = i < filteredSubs.length - 1 ? 'flex' : 'none';
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}
document.getElementById('lb-close').addEventListener('click', closeLightbox);
document.getElementById('lightbox').addEventListener('click', e => { if (e.target === e.currentTarget) closeLightbox(); });
document.getElementById('lb-prev').addEventListener('click', e => { e.stopPropagation(); showLb(--lbIndex); });
document.getElementById('lb-next').addEventListener('click', e => { e.stopPropagation(); showLb(++lbIndex); });
document.addEventListener('keydown', e => {
  if (!document.getElementById('lightbox').classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft'  && lbIndex > 0) showLb(--lbIndex);
  if (e.key === 'ArrowRight' && lbIndex < filteredSubs.length-1) showLb(++lbIndex);
});

/* ── 새로고침 버튼 ─────────────────────────────── */
document.getElementById('btn-refresh').addEventListener('click', loadData);

/* ── 초기 로드 ──────────────────────────────────── */
loadData();
</script>
